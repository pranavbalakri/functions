name = "verifiedSqrt"
version = "0.1.0"
defaultTargets = ["VerifiedSqrt"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "VerifiedSqrt"

[[lean_exe]]
name = "checkInstructions"
root = "CheckInstructions"

[[lean_exe]]
name = "checkCore32"
root = "CheckCore32"

[[lean_exe]]
name = "checkMachine32"
root = "CheckMachine32"

[[lean_exe]]
name = "checkInteger"
root = "CheckInteger"

[[lean_exe]]
name = "checkScalarState"
root = "CheckScalarState"
